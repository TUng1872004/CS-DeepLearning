name: Ping Streamlit App

on:
  schedule:
    # every 6 hours; Streamlit Community Cloud sleeps after ~7 days idle
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping app
        run: |
          code=$(curl -sSL -o /dev/null -w "%{http_code}" \
            --retry 3 --retry-delay 10 --max-time 60 \
            "$URL")
          echo "HTTP $code from $URL"
          if [ "$code" != "200" ]; then
            echo "::error::Unexpected status $code"
            exit 1
          fi
        env:
          URL: https://odoctagger-v1.streamlit.app/
