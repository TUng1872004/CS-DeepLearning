name: Ping Streamlit App

on:
  schedule:
    # every 30 min; plain HTTP pings don't reach the app process so keep visits frequent
    - cron: "*/30 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .github/workflows
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Playwright
        run: |
          npm init -y >/dev/null
          npm install playwright >/dev/null
          npx playwright install --with-deps chromium

      - name: Wake app in a real browser
        run: node wake.js
        env:
          URL: https://odoctagger-v1.streamlit.app/
